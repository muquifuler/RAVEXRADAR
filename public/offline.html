<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Sin conexión · RAVEXRADAR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        padding: 24px; box-sizing: border-box; text-align: center;
        color: #d4d4d8; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 0; color: #fafafa; font-size: 24px; }
      h1 span { color: #facc15; }
      p { margin: 0; max-width: 320px; line-height: 1.5; font-size: 15px; }
      button {
        margin-top: 6px; min-height: 46px; padding: 12px 26px; border: none; border-radius: 12px;
        background: #facc15; color: #09090b; font-weight: 800; font-size: 15px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>RAVEX<span>RADAR</span></h1>
    <p>No tienes conexión ahora mismo. En cuanto vuelva, el mapa se carga solo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <script>window.addEventListener('online', () => location.reload());</script>
  </body>
</html>
