        <style>
      /* Pantalla de carga: se ve mientras arranca la app y luego se desvanece */
      html, body { margin: 0; background: #09090b; }
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: 24px; box-sizing: border-box; text-align: center;
        background: radial-gradient(600px 420px at 50% 42%, rgba(250, 204, 21, 0.08), transparent 70%), #09090b;
        color: #a1a1aa; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-loader.is-hidden { opacity: 0; visibility: hidden; }
      .loader-mark { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
      .loader-mark svg { position: relative; z-index: 2; width: 92px; height: 92px; animation: loaderBob 1.6s ease-in-out infinite; }
      .loader-ring {
        position: absolute; left: 50%; bottom: 10px; width: 70px; height: 20px; margin-left: -35px;
        border: 2px solid #facc15; border-radius: 50%; opacity: 0; animation: loaderRipple 1.8s ease-out infinite;
      }
      .loader-ring:nth-child(2) { animation-delay: 0.6s; }
      .loader-ring:nth-child(3) { animation-delay: 1.2s; }
      .loader-title { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 0.08em; color: #fafafa;  }
      .loader-title span { color: #facc15; }
      .loader-sub { margin: -10px 0 0; max-width: 300px; font-size: 13px; line-height: 1.5; }
      .loader-bar { width: 160px; height: 3px; border-radius: 99px; background: #1f1f25; overflow: hidden; }
      .loader-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 99px; background: #facc15;
        animation: loaderBar 1.2s ease-in-out infinite;
      }
      @keyframes loaderBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes loaderRipple { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
      @keyframes loaderBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .loader-mark svg, .loader-ring, .loader-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de carga (con texto real: lo leen Google y quien no tenga JavaScript) -->
    <div id="app-loader" role="status" aria-live="polite">
      <div class="loader-mark" aria-hidden="true">
        <span class="loader-ring"></span>
        <span class="loader-ring"></span>
        <span class="loader-ring"></span>
        <svg viewBox="18 18 84 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 106 C44 88 30 72 30 50 A30 30 0 0 1 90 50 C90 72 76 88 60 106 Z M60 37 A13 13 0 1 0 60 63 A13 13 0 1 0 60 37 Z" fill="#FACC15" fill-rule="evenodd"/>
          <circle cx="60" cy="50" r="6" fill="#FACC15"/>
        </svg>
      </div>
      <h1 class="loader-title">RAVEX<span>RADAR</span></h1>
      <p class="loader-sub">El mapa de raves y fiestas techno en España: DJs, clubs y promotores en un solo sitio.</p>
      <div class="loader-bar" aria-hidden="true"></div>
      <noscript><p class="loader-sub">Activa JavaScript para usar el mapa de RAVEXRADAR.</p></noscript>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
